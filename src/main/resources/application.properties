spring.application.name=nextstep_server

# Demo mode stays off unless NEXTSTEP_DEMO=true
nextstep.demo.enabled=${NEXTSTEP_DEMO:false}
nextstep.demo.email=demo@nextstep.app
nextstep.demo.password=${NEXTSTEP_DEMO_PASSWORD:}

# Database defaults are for Postgres.app on your own machine, set the DB_* env vars anywhere else
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/nextstep_db}
spring.datasource.username=${DB_USERNAME:${USER:postgres}}
spring.datasource.password=${DB_PASSWORD:}

# Flyway is in charge of the tables, Hibernate just checks the entities still match them
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Sessions run out after 5h of doing nothing (every request resets the clock) and use an HttpOnly cookie.
# Set SESSION_COOKIE_SECURE=true anywhere the site runs on HTTPS.
server.servlet.session.timeout=5h
server.servlet.session.cookie.name=NEXTSTEP_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
