spring.application.name=nextstep_server

# Demo mode: off unless NEXTSTEP_DEMO=true
nextstep.demo.enabled=${NEXTSTEP_DEMO:false}
nextstep.demo.email=demo@nextstep.app
nextstep.demo.password=${NEXTSTEP_DEMO_PASSWORD:}

# Database: defaults fit local Postgres.app; set DB_* env vars on any other host
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/nextstep_db}
spring.datasource.username=${DB_USERNAME:${USER:postgres}}
spring.datasource.password=${DB_PASSWORD:}

# Flyway owns the schema; Hibernate only checks that entities match it
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Session: 5h idle timeout (each request resets it), HttpOnly cookie.
# Set SESSION_COOKIE_SECURE=true wherever the site is served over HTTPS.
server.servlet.session.timeout=5h
server.servlet.session.cookie.name=NEXTSTEP_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
